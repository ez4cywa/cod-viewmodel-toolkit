name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source and Maya Python 3.7 syntax
        run: python tests/verify_source_contracts.py
      - name: Verify bundled CAST translator
        run: python tests/verify_vendored_cast.py
      - name: Verify bundled Blender CAST backend
        run: python tests/verify_vendored_blender_cast.py
      - name: Verify release building and localization
        run: python tests/verify_build_release.py
      - name: Verify standalone export and UI contracts
        run: |
          python tests/verify_standalone_exports.py
          python tests/verify_standalone_export_ui.py
      - name: Reject generated assets
        shell: bash
        run: |
          if find . -type f \( -name '*.ma' -o -name '*.mb' -o -name '*.blend' -o -name '*.cast' -o -name '*.smd' -o -name '*.fbx' -o -name '*.zip' -o -name '*.bak' \) | grep -q .; then
            echo 'Generated asset found in repository.'
            exit 1
          fi
